function showTaskModal(prefill=""){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Raise Task / Issue</h2><button class="close" onclick="closeModal()">×</button></div>
 <div class="form-grid"><div class="field"><label>PROPERTY</label><select id="tProperty">${state.properties.map(p=>`<option>${p.name}</option>`)}</select></div>
 <div class="field"><label>DEPARTMENT</label><select id="tDept">${DEPARTMENTS.slice(1).map(d=>`<option ${prefill===d[0]?"selected":""}>${d[0]}</option>`)}</select></div>
 <div class="field full"><label>TASK / ISSUE</label><input id="tTitle" placeholder="Describe task or issue"></div>
 <div class="field"><label>ASSIGNED TO</label><input id="tOwner" placeholder="Responsible person"></div>
 <div class="field"><label>DUE DATE</label><input id="tDue" type="date"></div>
 <div class="field"><label>PRIORITY</label><select id="tPriority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div>
 <div class="field"><label>STATUS</label><select id="tStatus"><option>Open</option><option>In Progress</option><option>Completed</option></select></div></div>
 <button class="btn" style="margin-top:20px" onclick="addTask()">Save Task</button></div></div>`);
}
function closeModal(){document.getElementById("modal")?.remove()}
function addTask(){
 const n=state.tasks.length+1;
 state.tasks.unshift({id:"TSK-"+String(n).padStart(3,"0"),property:tProperty.value,department:tDept.value,title:tTitle.value||"New Task",owner:tOwner.value||"Unassigned",due:tDue.value||"-",priority:tPriority.value,status:tStatus.value});
 save();closeModal();state.page="tasks";render();
}
function showPropertyModal(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Add Property</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid">
 ${["Property ID|pId","Hotel Name|pName","City|pCity","Region|pRegion","Total Keys|pKeys"].map(x=>{let [a,b]=x.split("|");return `<div class="field"><label>${a.toUpperCase()}</label><input id="${b}" placeholder="${a}"></div>`}).join("")}
 <div class="field"><label>STATUS</label><select id="pStatus"><option>Operational</option><option>Under Project</option><option>Pre-Opening</option></select></div></div><button class="btn" style="margin-top:20px" onclick="addProperty()">Save Property</button></div></div>`);
}
function addProperty(){state.properties.push({id:pId.value||"HTL"+String(state.properties.length+1).padStart(3,"0"),name:pName.value||"New Hotel",city:pCity.value||"-",region:pRegion.value||"-",keys:pKeys.value||0,status:pStatus.value});save();closeModal();state.page="properties";render()}
function render(){
 if(!state.user){loginPage();return}
 let c=state.page==="home"?home():state.page==="properties"?properties():state.page==="reports"?reports():state.page==="users"?users():state.page==="dept"?department(state.department):state.page==="ai-admin"?renderAIAdmin():home();
 app.innerHTML=layout(c);

 initMobileShell();
}
if(!handleVisitorKYCRoute()) render();


/* ========================= INSYNC AI ADMIN COMMAND CENTER =========================
   Normal users continue to work manually.
   Only Super Admin can open this screen.
   No OpenAI API key is stored in this HTML.
   Live ChatGPT integration uses secure server endpoints:
   POST /api/admin-ai
   POST /api/admin-ai/apply
==================================================================================== */
function aiAdminAllowed(){return !!(state.user && state.user.role==="Super Admin");}
function openAIAdmin(){
  if(!aiAdminAllowed()){alert("AI Admin is available only to Super Admin.");return}
  state.page="ai-admin";
  const detail=document.getElementById("module-detail");
  if(!detail){render();return}
  detail.innerHTML=renderAIAdmin();
}
function renderAIAdmin(){
  const audit=JSON.parse(localStorage.getItem("insync_ai_admin_audit")||"[]");
  const rows=audit.slice().reverse().slice(0,12).map(x=>`<tr><td>${escapeHtml(x.at)}</td><td>${escapeHtml(x.command)}</td><td>${escapeHtml(x.summary||"—")}</td><td><span class="ai-tag">${escapeHtml(x.status||"Proposed")}</span></td></tr>`).join("");
  return `<div class="ai-admin-wrap">
    <div class="ai-admin-hero"><div><h2>✦ INSYNC AI Admin Command Center</h2><p>Admin-only control for changing application rules, norms and configuration. Normal users will not see or use ChatGPT commands.</p></div><div class="ai-admin-lock">🔐 SUPER ADMIN ONLY</div></div>
    <div class="ai-admin-grid">
      <div class="ai-admin-card"><h3>Give an Admin Command</h3><div class="sub">Write the rule you want to change in normal language. ChatGPT proposes the exact change first; Admin confirms before applying.</div>
      <textarea id="aiAdminCommand" class="ai-command-box" placeholder="Example: Material Receipt me Invoice Number mandatory kar do.&#10;&#10;Example: Consumption requested quantity se zyada allow nahi honi chahiye.&#10;&#10;Example: Purchase Request approval sirf Finance HOD kar sake."></textarea>
      <div class="ai-ai-row"><button class="btn ai-primary" onclick="analyzeAIAdminCommand()">✦ Ask ChatGPT</button><button class="btn secondary" onclick="document.getElementById('aiAdminCommand').value=''">Clear</button><span style="font-size:11px;color:#7a828d">API key stays on the server.</span></div>
      <div id="aiAdminResult" class="ai-result"><div class="ai-result-title">Waiting for command</div><div style="font-size:12px;color:#737d8b">AI will interpret the instruction and return a proposed configuration change for Admin confirmation.</div></div></div>
      <div class="ai-admin-card"><h3>Quick Examples</h3><div class="sub">Click an example to load it.</div>
        <button class="ai-example" onclick="aiExample('Material Receipt me Invoice Number mandatory kar do.')">Invoice Number mandatory in Material Receipt</button>
        <button class="ai-example" onclick="aiExample('Consumption requested quantity se zyada allow nahi honi chahiye.')">Limit Consumption to requested quantity</button>
        <button class="ai-example" onclick="aiExample('Purchase Request approval sirf Finance HOD kar sake.')">Restrict PR approval to Finance HOD</button>
        <button class="ai-example" onclick="aiExample('Store Incharge ko indent approval ka authority do.')">Store Incharge approval authority</button>
        <button class="ai-example" onclick="aiExample('Material receipt ke baad stock update automatic hona chahiye.')">Auto-update stock after receipt</button>
      </div>
    </div>
    <div class="ai-admin-card ai-audit"><h3>AI Admin Audit Trail</h3><div class="sub">Commands are logged for accountability.</div><table><thead><tr><th>Time</th><th>Command</th><th>Summary</th><th>Status</th></tr></thead><tbody>${rows||`<tr><td colspan="4" style="color:#7a828d">No AI admin commands yet.</td></tr>`}</tbody></table></div>
  </div>`;
}
function aiExample(t){const el=document.getElementById("aiAdminCommand");if(el){el.value=t;el.focus();}}
function aiAudit(command,summary,status){
  const a=JSON.parse(localStorage.getItem("insync_ai_admin_audit")||"[]");
  a.push({at:new Date().toLocaleString("en-IN"),command,summary,status,user:state.user?.name||"Super Admin"});
  localStorage.setItem("insync_ai_admin_audit",JSON.stringify(a.slice(-100)));
}
async function analyzeAIAdminCommand(){
  if(!aiAdminAllowed()){alert("AI Admin is available only to Super Admin.");return}
  const command=(document.getElementById("aiAdminCommand")?.value||"").trim(),result=document.getElementById("aiAdminResult");
  if(!command){alert("Please enter an Admin command.");return}
  result.innerHTML=`<div class="ai-result-title">Connecting to AI…</div><div style="font-size:12px;color:#737d8b">Interpreting the requested application rule.</div>`;
  try{
    const response=await fetch("/api/admin-ai",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({
      command,user:{name:state.user?.name||"",role:state.user?.role||""},
      context:{app:"INSYNC OPERATIONS",mode:"admin-rule-change",rules:{normalUsersManual:true,adminOnly:true,confirmationRequired:true,noArbitraryCodeExecution:true}}
    })});
    if(!response.ok)throw new Error("AI backend not connected ("+response.status+").");
    const data=await response.json();
    const changes=(data.changes||[]).map(c=>`<div class="ai-kv"><b>${escapeHtml(c.setting)}</b><span>${escapeHtml(c.oldValue)} → <b>${escapeHtml(c.newValue)}</b></span></div>`).join("");
    result.innerHTML=`<div class="ai-result-title">Proposed Change</div><div style="font-size:13px;margin-bottom:10px">${escapeHtml(data.summary||data.message||"AI has proposed a configuration change.")}</div>${changes||""}${data.requiresConfirmation!==false?`<div class="ai-ai-row"><button class="btn ai-primary" onclick='confirmAIAdminChange(${JSON.stringify(data).replace(/</g,"\\\\u003c")})'>✓ Confirm & Apply</button><button class="btn secondary" onclick="document.getElementById('aiAdminResult').innerHTML='<div class=&quot;ai-result-title&quot;>Change cancelled</div>'">Cancel</button></div>`:""}`;
    aiAudit(command,data.summary||data.message||"Proposed change","Proposed");
  }catch(err){
    result.innerHTML=`<div class="ai-result-title">AI connection not active</div><div style="font-size:12px;color:#7a3030">${escapeHtml(err.message)}</div><div style="font-size:12px;color:#737d8b;margin-top:8px">The Admin UI is installed. Connect a secure backend to <b>/api/admin-ai</b>; never put the API key in this HTML.</div>`;
  }
}
async function confirmAIAdminChange(data){
  if(!aiAdminAllowed()){alert("Only Super Admin can apply AI changes.");return}
  if(!confirm("Apply this configuration change to INSYNC OPERATIONS?"))return;
  try{
    const response=await fetch("/api/admin-ai/apply",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({proposal:data,user:{name:state.user?.name||"",role:state.user?.role||""}})});
    if(!response.ok)throw new Error("Apply endpoint not connected ("+response.status+").");
    const result=await response.json();
    aiAudit(data.command||"Admin AI proposal",data.summary||"Configuration applied","Applied");
    alert(result.message||"AI Admin change applied successfully.");openAIAdmin();
  }catch(err){alert("Change was not applied: "+err.message+"\\n\\nThe live backend must expose /api/admin-ai/apply.");}
}

</script>
