function amcStatus(r){

 const end=new Date(r.endDate+"T23:59:59"),now=new Date(),days=Math.ceil((end-now)/86400000);
 if(days<0)return '<span class="amc-pill amc-expired">Expired</span>';
 if(days<=30)return '<span class="amc-pill amc-expiring">Expiring Soon</span>';
 return '<span class="amc-pill amc-active">Active</span>';
}

}
function filterAMC(q){
 syncAMCFromAssets();const s=(q||"").toLowerCase(),f=document.getElementById("amcStatusFilter")?.value||"";
 const rows=(state.amcRecords||[]).filter(r=>(!s||`${r.assetName} ${r.vendor} ${r.property} ${r.assetId}`.toLowerCase().includes(s))&&(!f||amcStatusLabel(r)===f));
 const a=document.getElementById("amcTableArea");if(a)a.innerHTML=renderAMCTable(rows);
}
function amcStatusLabel(r){
 if(!r.endDate)return "No End Date";
 const end=new Date(r.endDate+"T23:59:59"),now=new Date(),days=Math.ceil((end-now)/86400000);
 if(days<0)return "Expired";if(days<=30)return "Expiring Soon";return "Active";
}
function showAMCModal(existingId=""){
 syncAMCFromAssets();
 const assets=(state.assets||[]).filter(a=>a.amcVendor);
 const r=existingId?(state.amcRecords||[]).find(x=>x.id===existingId):null;
 if(existingId&&!r){alert("AMC record not found.");return;}
 const selectedAsset=r?.assetId||assets[0]?.id||"";
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal" style="max-width:900px"><div class="modal-head"><h2>${r?"Modify AMC":"Add / Update AMC"}</h2><button class="close" onclick="closeModal()">×</button></div>

 <div class="access-box"><b>Asset linkage:</b> This AMC record is linked to Asset Master, so the same asset will stay visible in both modules.</div>
 <button class="btn" style="margin-top:18px" onclick="saveAMCRecord('${r?.id||""}')">${r?"Update AMC":"Save AMC"}</button></div></div>`);
}
async function saveAMCRecord(existingId){
 syncAMCFromAssets();
 let r=existingId?(state.amcRecords||[]).find(x=>x.id===existingId):null;
 const assetId=document.getElementById("amcAsset").value,asset=(state.assets||[]).find(x=>x.id===assetId);
 if(!r && !asset){alert("Please select an asset.");return;}
 if(!r){r={id:"AMC-"+String(state.amcRecords.length+1).padStart(3,"0"),assetId,assetName:asset.assetName,property:asset.property};state.amcRecords.push(r);}
 r.vendor=document.getElementById("amcVendor").value;r.startDate=document.getElementById("amcStart").value;r.endDate=document.getElementById("amcEnd").value;r.annualCost=Number(document.getElementById("amcCost").value||0);r.remarks=document.getElementById("amcRemarks").value;
 const f=document.getElementById("amcDocFile").files[0];
 if(f){r.documentName=f.name;r.documentData=await fileAsDataURL(f);}
 // Keep Asset Master synced with the AMC flag/details.
 const linked=(state.assets||[]).find(a=>a.id===r.assetId);
 if(linked){linked.amcVendor=r.vendor;linked.amcStartDate=r.startDate;linked.amcEndDate=r.endDate;linked.amcCost=r.annualCost;linked.amcDocumentName=r.documentName||"";linked.amcDocumentData=r.documentData||"";}
 saveAssets();localStorage.setItem("insync_amc_records",JSON.stringify(state.amcRecords||[]));closeModal();openAMC();
}
function openAMCDoc(id){
 const r=(state.amcRecords||[]).find(x=>x.id===id);if(!r||!r.documentData)return;
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal" style="max-width:1000px"><div class="modal-head"><h2>${escapeHtml(r.documentName||"AMC Document")}</h2><button class="close" onclick="closeModal()">×</button></div><p><b>${escapeHtml(r.assetName)}</b> • ${escapeHtml(r.property)} • ${escapeHtml(r.vendor||"")}</p>${String(r.documentData).startsWith("data:application/pdf")?`<iframe src="${r.documentData}" style="width:100%;height:65vh;border:1px solid #ddd;border-radius:10px"></iframe>`:`<img src="${r.documentData}" style="max-width:100%;max-height:65vh;object-fit:contain;border:1px solid #ddd;border-radius:10px">`}</div></div>`);
}
function downloadAMCDoc(id){
 const r=(state.amcRecords||[]).find(x=>x.id===id);if(!r||!r.documentData)return;
 const a=document.createElement("a");a.href=r.documentData;a.download=r.documentName||`${r.id}_AMC_Document`;a.click();
}
function exportAMCReport(){
 syncAMCFromAssets();const rows=[["AMC ID","Asset ID","Asset","Property","Vendor","Start Date","End Date","Annual Cost","Status","Document"],...(state.amcRecords||[]).map(r=>[r.id,r.assetId,r.assetName,r.property,r.vendor,r.startDate,r.endDate,r.annualCost,amcStatusLabel(r),r.documentName||""])];
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="AMC_Status_Report.csv";a.click();
}
function saveAssets(){localStorage.setItem("insync_assets",JSON.stringify(state.assets||[]));localStorage.setItem("insync_asset_access",JSON.stringify(state.assetAccess||{}));}
function assetStatus(v){
 if(v==="Running")return '<span class="asset-pill asset-running">Running</span>';
 if(v==="Under Maintenance")return '<span class="asset-pill asset-maint">Under Maintenance</span>';
 if(v==="Breakdown")return '<span class="asset-pill asset-breakdown">Breakdown</span>';
 return '<span class="asset-pill asset-inactive">Inactive</span>';
}
function assetTotalCost(a){return (a.costs||[]).reduce((sum,x)=>sum+(Number(x.amount)||0),0);}

function filterAssets(q){

function saveAssetCost(id){
 const a=(state.assets||[]).find(x=>x.id===id);if(!a)return;
 const type=document.getElementById("cType").value;
 const amount=Number(document.getElementById("cAmount").value||0);
 if(type==="Spare Part" && amount<=0){alert("Please enter quantity and unit cost for the spare part.");return;}
 a.costs=a.costs||[];
 a.costs.push({
   date:document.getElementById("cDate").value,
   amount,
   type,
   vendor:document.getElementById("cVendor").value,
   work:document.getElementById("cWork").value,
   remarks:document.getElementById("cRemarks").value,
   partName:type==="Spare Part"?(document.getElementById("cPartName")?.value||""):"",
   partNo:type==="Spare Part"?(document.getElementById("cPartNo")?.value||""):"",
   qty:type==="Spare Part"?Number(document.getElementById("cQty")?.value||0):0,
   unitCost:type==="Spare Part"?Number(document.getElementById("cUnitCost")?.value||0):0,
   stockRef:type==="Spare Part"?(document.getElementById("cStockRef")?.value||""):"",
   replacedComponent:type==="Spare Part"?(document.getElementById("cReplaced")?.value||""):""
 });
 saveAssets();document.getElementById("costModal")?.remove();openAssetMaster();showAssetCostLog(id);

function createGRN(){
 const po=state.purchaseOrders.find(x=>x.id===document.getElementById("grnPO").value);if(!po)return;
 const items=po.items.map((i,idx)=>({material:i.material,ordered:i.qty,received:Number(document.getElementById("grnRec"+idx).value||0),unit:i.unit}));
 const complete=items.every(i=>i.received>=i.ordered),partial=items.some(i=>i.received>0);
 state.grns.push({id:"GRN-"+new Date().getFullYear()+"-"+String(state.grns.length+1).padStart(3,"0"),poId:po.id,property:po.property,vendor:po.vendor,date:document.getElementById("grnDate").value,invoice:document.getElementById("grnInvoice").value,receivedBy:document.getElementById("grnReceivedBy")?.value||state.user?.name||"Store Incharge",status:complete?"Received":partial?"Partial":"Open",items});
 po.status=complete?"Received":"Partial";const pr=state.purchaseRequests.find(x=>x.id===po.prId);if(pr)pr.status=po.status;
 savePurchaseData();closeModal();openPurchaseModule("grn");

function purchaseReceivedQty(materialCode,materialName){
 return (state.grns||[]).reduce((sum,g)=>(g.items||[]).reduce((s,i)=>s+((i.materialCode===materialCode||(!materialCode&&i.material===materialName))?Number(i.received||0):0),sum),0);
}
function purchaseConsumedQty(materialCode,materialName){
 return (state.materialConsumptions||[]).filter(c=>c.materialCode===materialCode||(!materialCode&&c.material===materialName)).reduce((s,c)=>s+Number(c.consumedQty||0),0);
}
function purchaseAvailableQty(materialCode,materialName){return Math.max(0,purchaseReceivedQty(materialCode,materialName)-purchaseConsumedQty(materialCode,materialName));}
function renderPurchaseConsumptionPage(detail){
 const all=(state.materialConsumptions||[]).slice().reverse();
 const rows=all.map(c=>{const bal=Math.max(0,Number(c.requestedQty||0)-Number(c.consumedQty||0)),stock=purchaseAvailableQty(c.materialCode,c.material);return `<tr><td><span class="req-no">${escapeHtml(c.id)}</span></td><td>${escapeHtml(c.indentId)}</td><td>${escapeHtml(c.material)}</td><td>${escapeHtml(c.department)}</td><td>${c.requestedQty} ${escapeHtml(c.unit||"")}</td><td>${c.consumedQty||0}</td><td>${stock}</td><td>${purchaseStatus(bal<=0?"Consumed":"Pending Consumption")}</td><td>${bal>0?`<button class="btn" style="padding:7px 10px;font-size:11px" onclick="showPurchaseConsumptionModal('${c.id}')">Consume</button>`:"—"}</td></tr>`}).join("");
 const pending=all.filter(c=>Number(c.consumedQty||0)<Number(c.requestedQty||0)).length;
 detail.innerHTML=`<div class="panel" style="margin-top:18px"><div class="page-head"><div><h3>Material Consumption</h3><p>Only Store-Incharge-approved indents appear here. Consumption is blocked when available stock is insufficient.</p></div><div class="purchase-summary" style="margin:0"><div class="purchase-mini"><small>PENDING</small><b>${pending}</b></div><div class="purchase-mini"><small>RECEIPT STOCK</small><b>${all.reduce((s,c)=>s+purchaseReceivedQty(c.materialCode,c.material),0)}</b></div></div></div><div class="grn-card" style="margin-bottom:14px"><b>Workflow:</b> Any User raises Indent → <b>Store Incharge approves</b> → item appears here → Store records actual consumption.</div><div class="purchase-table-wrap"><table class="purchase-table"><thead><tr><th>Consumption No.</th><th>Indent</th><th>Material</th><th>Department</th><th>Requested</th><th>Consumed</th><th>Available Stock</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows||"<tr><td colspan='9'>No approved indents are available for consumption.</td></tr>"}</tbody></table></div></div>`;
}
function showPurchaseConsumptionModal(id){
 const c=(state.materialConsumptions||[]).find(x=>x.id===id);if(!c)return;
 const remaining=Math.max(0,Number(c.requestedQty||0)-Number(c.consumedQty||0)),stock=purchaseAvailableQty(c.materialCode,c.material),max=Math.min(remaining,stock);
 if(max<=0){alert("No available stock for this material. Receive the material first.");return;}
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Record Material Consumption</h2><button class="close" onclick="closeModal()">×</button></div><div class="grn-card"><b>${escapeHtml(c.material)}</b><br>Indent: ${escapeHtml(c.indentId)} &nbsp; | &nbsp; Requested: ${c.requestedQty} ${escapeHtml(c.unit||"")} &nbsp; | &nbsp; Available Stock: ${stock}</div><div class="form-grid" style="margin-top:14px"><div class="field"><label>CONSUMPTION QTY</label><input id="pcQty" type="number" min="1" max="${max}" value="${max}"></div><div class="field"><label>DATE</label><input id="pcDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>CONSUMED BY</label><input id="pcBy" value="${escapeHtml(state.user?.name||c.requester||"Store Incharge")}"></div><div class="field"><label>WORK / PURPOSE</label><input id="pcPurpose" value="${escapeHtml((state.indents||[]).find(x=>x.id===c.indentId)?.purpose||"")}"></div><div class="field full"><label>REMARKS</label><textarea id="pcRemarks" rows="3"></textarea></div></div><button class="btn" style="margin-top:18px" onclick="recordPurchaseConsumption('${c.id}')">Confirm Consumption</button></div></div>`);
}
function recordPurchaseConsumption(id){
 const c=(state.materialConsumptions||[]).find(x=>x.id===id);if(!c)return;const qty=Number(document.getElementById("pcQty").value||0);
 const remaining=Math.max(0,Number(c.requestedQty||0)-Number(c.consumedQty||0)),stock=purchaseAvailableQty(c.materialCode,c.material);
 if(qty<=0||qty>remaining){alert(`Consumption quantity cannot exceed remaining indent quantity (${remaining}).`);return;}
 if(qty>stock){alert(`Only ${stock} ${c.unit||"units"} is available in stock.`);return;}
 c.consumedQty=Number(c.consumedQty||0)+qty;c.status=c.consumedQty>=Number(c.requestedQty||0)?"Consumed":"Partially Consumed";c.lastConsumedBy=document.getElementById("pcBy").value;c.lastConsumedDate=document.getElementById("pcDate").value;c.purpose=document.getElementById("pcPurpose").value;c.remarks=document.getElementById("pcRemarks").value;c.updatedAt=new Date().toISOString();
 savePurchaseData();closeModal();openPurchaseModule("consumption");
}

function generateMaterialCode(category){

 const seq=(state.materials||[]).filter(m=>String(m.code||"").startsWith(`MAT-${prefix}-`)).length+1;
 return `MAT-${prefix}-${String(seq).padStart(4,"0")}`;
}

function openProjectGantt(){
 const detail=document.getElementById("module-detail");if(!detail)return;
 const {start,end}=projectDateRange(),plan=state.projectPlan||[];
 const view=state.ganttView||"Month";
 let days=[];
 if(view==="Date"){
   const d=new Date();d.setHours(0,0,0,0);days=[d];
 }else if(view==="Year"){
   for(let m=0;m<12;m++)days.push(new Date(start.getFullYear(),m,1));
 }else{
   days=ganttDays(start,end);
 }
 const done=plan.filter(x=>x.progress>=100||x.status==="Done").length;
 const active=plan.filter(x=>x.status==="In Progress").length;
 const pending=plan.filter(x=>x.progress<100&&x.status!=="In Progress").length;
 const late=plan.filter(x=>new Date(x.end)<new Date()&&x.progress<100).length;
 const overall=plan.length?Math.round(plan.reduce((s,x)=>s+Number(x.progress||0),0)/plan.length):0;

 const head=days.map(d=>view==="Year"
   ? `<th class="gantt-day">${d.toLocaleDateString("en-IN",{month:"short"})}<br><span style="font-size:9px">${d.getFullYear()}</span></th>`
   : `<th class="gantt-day">${d.getDate()}<br><span style="font-size:9px">${d.toLocaleDateString("en-IN",{month:"short"})}</span></th>`
 ).join("");

 const rows=plan.map(item=>{
   const s=new Date(item.start),e=new Date(item.end);
   const cells=days.map(d=>{
     let activeDay=false;
     if(view==="Year") activeDay=d.getFullYear()>=s.getFullYear()&&d.getFullYear()<=e.getFullYear();
     else if(view==="Month") activeDay=d>=s&&d<=e;
     else activeDay=d.toISOString().slice(0,10)>=item.start && d.toISOString().slice(0,10)<=item.end;
     return `<td class="gantt-day">${activeDay?`<div class="gantt-bar ${ganttClass(item)}" title="${escapeHtml(item.task)} • ${item.progress}%">${(view==="Year"||d.toISOString().slice(0,10)===item.start)?item.progress+"%":""}</div>`:""}</td>`;
   }).join("");
   return `<tr><td class="task-col"><b>${escapeHtml(item.task)}</b><div style="font-size:10px;color:#808790">${escapeHtml(item.category)} • ${escapeHtml(item.owner)}</div></td>${cells}</tr>`;
 }).join("");

 detail.innerHTML=`<div class="gantt-wrap">
  <div class="gantt-head">
   <div class="gantt-title"><h3>Project Master Gantt Chart</h3><p>Owner-ready project plan for ${escapeHtml(state.selectedProperty||"Park Inn Suites Roorkee")}.</p></div>
   <div class="gantt-head-access"><span class="access-badge">HEAD: ${escapeHtml(state.ganttHead)}</span><span class="access-badge">HOD: ${escapeHtml(state.ganttHod)}</span><button class="btn secondary" onclick="showGanttAccessSettings()">🔐 Modify Access</button></div>
  </div>
  <div class="gantt-modbar">
    <b style="margin-right:4px">View:</b>
    ${["Date","Month","Year"].map(v=>`<button class="gantt-mode ${view===v?"active":""}" onclick="state.ganttView='${v}';localStorage.setItem('insync_gantt_view','${v}');openProjectGantt()">${v}</button>`).join("")}
    <button class="gantt-mode" onclick="showGanttDateSettings()">📅 Set Timeline</button>
    <button class="gantt-mode" onclick="showProjectTaskModal()">+ Add Activity</button>
    <button class="gantt-mode" onclick="exportProjectGantt()">📊 Excel</button>
    <button class="gantt-mode" onclick="printProjectGantt()">📄 PDF</button>
  </div>
  <div class="gantt-kpis"><div class="gantt-kpi"><small>TOTAL ACTIVITIES</small><b>${plan.length}</b></div><div class="gantt-kpi"><small>COMPLETED</small><b>${done}</b></div><div class="gantt-kpi"><small>IN PROGRESS</small><b>${active}</b></div><div class="gantt-kpi"><small>PENDING</small><b>${pending}</b></div><div class="gantt-kpi"><small>OVERALL PROGRESS</small><b>${overall}%</b></div></div>
  ${late?`<div class="overdue-banner" style="margin:10px 0">⚠ ${late} activity(ies) are past the end date and not yet complete.</div>`:""}
  <div class="gantt-legend"><span><i class="g-dot" style="background:#dff1e5"></i>Completed</span><span><i class="g-dot" style="background:#dfe8fb"></i>In Progress</span><span><i class="g-dot" style="background:#fff0d0"></i>At Risk</span><span><i class="g-dot" style="background:#fde1e1"></i>Delayed</span></div>
  <div class="gantt-scroll"><table class="gantt-table"><thead><tr><th class="task-col task-head">Activity / Owner</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
 </div>`;
}

function helpStatus(v){
 const map={"New":"hd-new","Acknowledged":"hd-ack","Work in Progress":"hd-wip","Pending":"hd-pending","On Hold":"hd-hold","Completed":"hd-done","Overdue":"hd-overdue"};
 return `<span class="hd-pill ${map[v]||"hd-new"}">${escapeHtml(v)}</span>`;
}
function complaintSlaDue(c){
 if(c.dueAt)return new Date(c.dueAt);
 const mins=Number(state.helpdeskSLA?.[c.priority]||240);
 return new Date(new Date(c.createdAt).getTime()+mins*60000);
}
function refreshComplaintEscalations(){
 let changed=false;
 const now=new Date();
 (state.helpdeskComplaints||[]).forEach(c=>{
   if(c.status!=="Completed" && c.status!=="On Hold"){
     const due=complaintSlaDue(c);
     if(now>due){
       if(c.status!=="Overdue"){c.status="Overdue";changed=true;}
       c.escalatedAt=c.escalatedAt||now.toISOString();
     }
   }
 });
 if(changed)saveHelpdesk();
}
function complaintElapsed(c){
 const start=new Date(c.createdAt),end=c.completedAt?new Date(c.completedAt):new Date();
 return Math.max(0,Math.round((end-start)/60000));
}

function complaintPropertyId(property){
 const p=String(property||"").trim().toLowerCase();
 const known={
  "park inn suites roorkee":"PISR",
  "insync delhi":"ISDL",
  "insync jaipur":"ISJP",
  "insync mumbai":"ISMB",
  "insync ujjain":"ISUJ"
 };
 if(known[p])return known[p];
 const words=p.split(/\s+/).filter(Boolean);
 const initials=words.map(w=>w.replace(/[^a-z0-9]/gi,"").charAt(0)).join("").toUpperCase();
 return (initials||"HTL").slice(0,6);
}
function nextComplaintToken(property){
 const pid=complaintPropertyId(property),year=new Date().getFullYear();
 const same=(state.helpdeskComplaints||[]).filter(c=>complaintPropertyId(c.property)===pid);
 const seq=same.reduce((max,c)=>{const m=String(c.id||"").match(new RegExp("^"+pid+"-"+year+"-(\\\\d+)$"));return m?Math.max(max,Number(m[1])):max;},0)+1;
 return `${pid}-${year}-${String(seq).padStart(3,"0")}`;
}
function migrateComplaintTokens(){
 (state.helpdeskComplaints||[]).forEach(c=>{
   const pid=complaintPropertyId(c.property);
   const year=new Date(c.createdAt||Date.now()).getFullYear();
   const old=String(c.id||"");
   if(old.startsWith("HD-")||old.startsWith("PISR-")||old.startsWith(pid+"-")){
      const n=old.match(/(?:HD-\\d{4}-|[A-Z0-9]+-\\d{4}-)(\\d+)$/);
      if(n)c.id=`${pid}-${year}-${String(Number(n[1])).padStart(3,"0")}`;
   }
 });
 saveHelpdesk();
}
migrateComplaintTokens();

function distanceToLocation(lat1,lon1,lat2,lon2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2,c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));return R*c;}

function renderSalesCalls(rows){
 return `<div style="overflow:auto"><table class="salescall-table"><thead><tr><th>Call ID</th><th>Sales Employee</th><th>Client / Office</th><th>Purpose</th><th>Visit Date</th><th>Location</th><th>Check-in</th><th>Check-out</th><th>Duration</th><th>Status</th><th>Outcome / Next Action</th><th>Action</th></tr></thead><tbody>${rows.map(c=>`<tr><td><span class="ticket-id">${escapeHtml(c.id)}</span></td><td><b>${escapeHtml(c.employee)}</b><div style="font-size:10px;color:#7b828c">${escapeHtml(c.employeeId)}</div></td><td><b>${escapeHtml(c.client)}</b><div style="font-size:10px;color:#7b828c">${escapeHtml(c.contact||"")}</div></td><td>${escapeHtml(c.purpose)}</td><td>${escapeHtml(c.plannedDate)} ${escapeHtml(c.plannedTime||"")}</td><td><span class="location-chip">📍 ${escapeHtml(c.locationName||"Office")}</span><div style="font-size:10px;color:#7b828c">${escapeHtml(c.locationAddress||"")}</div>${c.latitude&&c.longitude?`<div style="font-size:10px;color:#7b828c">${escapeHtml(c.latitude)}, ${escapeHtml(c.longitude)}</div>`:""}</td><td>${c.checkIn?new Date(c.checkIn).toLocaleString("en-IN"):"—"}</td><td>${c.checkOut?new Date(c.checkOut).toLocaleString("en-IN"):"—"}</td><td>${salesCallDuration(c)}</td><td>${salesCallStatus(c.status)}</td><td><b>${escapeHtml(c.outcome||"—")}</b><div style="font-size:10px;color:#7b828c">${escapeHtml(c.nextAction||"")} ${c.nextDate?`• ${escapeHtml(c.nextDate)}`:""}</div></td><td><div class="ppm-action">${c.status==="Planned"?`<button class="btn" onclick="startSalesVisit('${c.id}')">Start Visit</button>`:""}${c.status==="On Visit"?`<button class="btn" onclick="completeSalesVisit('${c.id}')">Finish Visit</button>`:""}<button class="btn secondary" onclick="viewSalesCall('${c.id}')">View</button></div></td></tr>`).join("")||"<tr><td colspan='12'>No sales calls recorded.</td></tr>"}</tbody></table></div>`;
}
function salesCallDuration(c){if(!c.checkIn)return "—";const end=c.checkOut?new Date(c.checkOut):new Date();const min=Math.max(0,Math.round((end-new Date(c.checkIn))/60000));return `${min} min`;}
function filterSalesCalls(q){const s=(q||"").toLowerCase(),st=document.getElementById("callStatusFilter")?.value||"";const rows=(state.salesCalls||[]).filter(c=>(!s||`${c.id} ${c.employee} ${c.client} ${c.locationName} ${c.locationAddress}`.toLowerCase().includes(s))&&(!st||c.status===st));const a=document.getElementById("salesCallTable");if(a)a.innerHTML=renderSalesCalls(rows);}
function showSalesCallModal(){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal" style="max-width:920px"><div class="modal-head"><h2>New Sales Call / Field Visit</h2><button class="close" onclick="closeModal()">×</button></div>
 <p class="hint">Enter the client/office details. At visit start, the app can capture GPS and exact check-in time if the employee grants browser location permission.</p>
 <div class="form-grid"><div class="field"><label>EMPLOYEE NAME</label><input id="callEmployee" value="${escapeHtml(state.user?.name||"Sales Executive")}"></div><div class="field"><label>EMPLOYEE ID</label><input id="callEmployeeId" placeholder="SAM001"></div><div class="field"><label>HOTEL</label><input id="callHotel" value="${escapeHtml(state.selectedProperty||"Park Inn Suites Roorkee")}"></div><div class="field"><label>CLIENT / OFFICE</label><input id="callClient" placeholder="Company / office name"></div><div class="field"><label>CONTACT PERSON</label><input id="callContact"></div><div class="field"><label>VISIT DATE</label><input id="callDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>PLANNED TIME</label><input id="callTime" type="time"></div><div class="field"><label>PURPOSE</label><select id="callPurpose"><option>Corporate rate discussion</option><option>Sales Call</option><option>Site Visit</option><option>Travel Agent / OTA Meeting</option><option>MICE / Event Enquiry</option><option>Wedding / Social Event</option><option>Payment / Collection Follow-up</option><option>Relationship Visit</option></select></div><div class="field"><label>OFFICE / LOCATION NAME</label><input id="callLocationName" placeholder="ABC Corporate Office"></div><div class="field full"><label>LOCATION / OFFICE ADDRESS</label><textarea id="callAddress" rows="2" placeholder="Building, street, city"></textarea></div><div class="field"><label>NEXT ACTION</label><input id="callNextAction" placeholder="Send tariff / proposal / follow-up"></div><div class="field"><label>NEXT DATE</label><input id="callNextDate" type="date"></div><div class="field full"><label>NOTES</label><textarea id="callNotes" rows="3"></textarea></div></div>
 <div id="callGpsMsg" class="sla-box">📍 GPS: Not captured yet. Use “Create & Start Visit” to capture current location.</div>
 <button class="btn" style="margin-top:18px" onclick="createAndStartSalesCall()">Create & Start Visit</button></div></div>`);
}
function getSalesGPS(){
 return new Promise(resolve=>{
  if(!navigator.geolocation){resolve(null);return;}
  navigator.geolocation.getCurrentPosition(pos=>resolve({latitude:pos.coords.latitude.toFixed(6),longitude:pos.coords.longitude.toFixed(6),accuracy:Math.round(pos.coords.accuracy)}),()=>resolve(null),{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
 });
}
async function createAndStartSalesCall(){
 const client=document.getElementById("callClient").value.trim();if(!client){alert("Client / office name is required.");return;}
 const now=new Date(),id=`CALL-${now.getFullYear()}-${String((state.salesCalls||[]).length+1).padStart(3,"0")}`,gps=await getSalesGPS();
 state.salesCalls.push({id,employee:document.getElementById("callEmployee").value,employeeId:document.getElementById("callEmployeeId").value,property:document.getElementById("callHotel").value,client,contact:document.getElementById("callContact").value,purpose:document.getElementById("callPurpose").value,plannedDate:document.getElementById("callDate").value,plannedTime:document.getElementById("callTime").value,checkIn:now.toISOString(),checkOut:"",locationName:document.getElementById("callLocationName").value||client,locationAddress:document.getElementById("callAddress").value,latitude:gps?.latitude||"",longitude:gps?.longitude||"",gpsAccuracy:gps?.accuracy||"",status:"On Visit",outcome:"",nextAction:document.getElementById("callNextAction").value,nextDate:document.getElementById("callNextDate").value,notes:document.getElementById("callNotes").value});
 saveSalesCalls();closeModal();openSalesCallTracker();
 alert(gps?`Visit started. GPS captured at ${gps.latitude}, ${gps.longitude}.`:"Visit started. GPS permission was not available, so no coordinates were saved.");
}
async function startSalesVisit(id){
 const c=state.salesCalls.find(x=>x.id===id);if(!c)return;
 c.status="On Visit";c.checkIn=new Date().toISOString();const gps=await getSalesGPS();if(gps){c.latitude=gps.latitude;c.longitude=gps.longitude;c.gpsAccuracy=gps.accuracy;}
 saveSalesCalls();openSalesCallTracker();
}
function completeSalesVisit(id){
 const c=state.salesCalls.find(x=>x.id===id);if(!c)return;c.checkOut=new Date().toISOString();c.status="Completed";c.outcome=prompt("Enter visit outcome","Meeting completed")||c.outcome;c.notes=prompt("Enter visit notes",c.notes||"")||c.notes;saveSalesCalls();openSalesCallTracker();
}
function viewSalesCall(id){
 const c=state.salesCalls.find(x=>x.id===id);if(!c)return;
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal" style="max-width:850px"><div class="modal-head"><h2>${escapeHtml(c.id)} – Visit Detail</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>EMPLOYEE</label><div>${escapeHtml(c.employee)} (${escapeHtml(c.employeeId)})</div></div><div class="field"><label>CLIENT / OFFICE</label><div>${escapeHtml(c.client)} • ${escapeHtml(c.contact||"")}</div></div><div class="field"><label>DATE / PLANNED TIME</label><div>${escapeHtml(c.plannedDate)} ${escapeHtml(c.plannedTime||"")}</div></div><div class="field"><label>STATUS</label><div>${salesCallStatus(c.status)}</div></div><div class="field full"><label>LOCATION</label><div>${escapeHtml(c.locationName||"")}<br>${escapeHtml(c.locationAddress||"")}<br>GPS: ${escapeHtml(c.latitude||"—")}, ${escapeHtml(c.longitude||"—")}</div></div><div class="field"><label>CHECK-IN</label><div>${c.checkIn?new Date(c.checkIn).toLocaleString("en-IN"):"—"}</div></div><div class="field"><label>CHECK-OUT</label><div>${c.checkOut?new Date(c.checkOut).toLocaleString("en-IN"):"—"}</div></div><div class="field"><label>DURATION</label><div>${salesCallDuration(c)}</div></div><div class="field"><label>OUTCOME</label><div>${escapeHtml(c.outcome||"—")}</div></div><div class="field full"><label>NEXT ACTION / NOTES</label><div>${escapeHtml(c.nextAction||"—")} ${c.nextDate?`• ${escapeHtml(c.nextDate)}`:""}<br>${escapeHtml(c.notes||"")}</div></div></div></div></div>`);
}
function exportSalesCalls(){
 const rows=[["CALL ID","Employee","Employee ID","Hotel","Client / Office","Contact","Purpose","Planned Date","Planned Time","Location","Address","Latitude","Longitude","Check-in","Check-out","Duration","Status","Outcome","Next Action","Next Date"],...(state.salesCalls||[]).map(c=>[c.id,c.employee,c.employeeId,c.property,c.client,c.contact,c.purpose,c.plannedDate,c.plannedTime,c.locationName,c.locationAddress,c.latitude,c.longitude,c.checkIn,c.checkOut,salesCallDuration(c),c.status,c.outcome,c.nextAction,c.nextDate])];
 const csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="Sales_Call_Field_Visit_Report.csv";a.click();
}


function saveFNB(){localStorage.setItem("insync_fnb_tables",JSON.stringify(state.fnbTables||[]));localStorage.setItem("insync_fnb_orders",JSON.stringify(state.fnbOrders||[]));}
function fnbOrderStatus(v){const m={New:"fnb-new",Acknowledged:"fnb-ack","Work in Progress":"fnb-wip",Late:"fnb-late",Ready:"fnb-ready",Served:"fnb-served"};return `<span class="fnb-status ${m[v]||"fnb-new"}">${escapeHtml(v)}</span>`;}
function fnbMinutes(o){const end=o.servedAt||new Date().toISOString();return Math.max(0,Math.round((new Date(end)-new Date(o.createdAt))/60000))+" min";}
function fnbSlaMinutes(p){return p==="Urgent"?10:p==="High"?15:25;}
function refreshFNBOrders(){let ch=false;const now=new Date();(state.fnbOrders||[]).forEach(o=>{if(!["Served","Late"].includes(o.status)&&((now-new Date(o.createdAt))/60000)>fnbSlaMinutes(o.priority)){o.status="Late";o.escalatedAt=o.escalatedAt||now.toISOString();ch=true;}});if(ch)saveFNB();}
function openFNBService(){
 const detail=document.getElementById("module-detail");if(!detail)return;refreshFNBOrders();
 const tables=state.fnbTables||[],orders=state.fnbOrders||[];
 detail.innerHTML=`<div class="panel" style="margin-top:18px"><div class="page-head"><div><h3>F&B Service – Table & Order Management</h3><p style="margin-top:5px">Book tables and send food orders instantly to the Kitchen Live Display.</p></div><button class="btn" onclick="showFNBOrderModal()">+ Take Order</button></div>
 <div class="fnb-tabs"><button class="fnb-tab active">SERVICE</button><button class="fnb-tab" onclick="openFNBKitchen()">KITCHEN</button></div>

 <div class="panel" style="margin-top:15px;background:#fafafa"><h3>Live Order Board</h3>${renderFNBTable(orders.slice().reverse())}</div></div>`;

function renderFNBTable(orders){return `<div class="fnb-table-wrap"><table class="fnb-table"><thead><tr><th>KOT</th><th>Table</th><th>Waiter</th><th>Items</th><th>Created</th><th>Elapsed</th><th>Status</th><th>Action</th></tr></thead><tbody>${orders.map(o=>`<tr><td><span class="ticket-id">${escapeHtml(o.id)}</span></td><td>${escapeHtml(o.tableName)}</td><td>${escapeHtml(o.waiter)}</td><td>${o.items.map(i=>`${escapeHtml(i.name)} × ${i.qty}`).join("<br>")}</td><td>${new Date(o.createdAt).toLocaleTimeString("en-IN")}</td><td>${fnbMinutes(o)}</td><td>${fnbOrderStatus(o.status)}</td><td><button class="btn secondary" onclick="viewFNBOrder('${o.id}')">View</button></td></tr>`).join("")||"<tr><td colspan='8'>No orders.</td></tr>"}</tbody></table></div>`;}
function openFNBKitchen(){
 const detail=document.getElementById("module-detail");if(!detail)return;refreshFNBOrders();
 const orders=(state.fnbOrders||[]).filter(o=>!["Served"].includes(o.status)).slice().reverse();
 detail.innerHTML=`<div class="panel" style="margin-top:18px"><div class="page-head"><div><h3>F&B Production – Kitchen Live Order Display</h3><p style="margin-top:5px">Orders appear here as soon as Service submits a KOT.</p></div><button class="btn secondary" onclick="openFNBService()">← Service</button></div>
 <div class="fnb-kpis"><div class="fnb-kpi"><small>NEW</small><b>${orders.filter(o=>o.status==="New").length}</b></div><div class="fnb-kpi"><small>ACKNOWLEDGED</small><b>${orders.filter(o=>o.status==="Acknowledged").length}</b></div><div class="fnb-kpi"><small>WORK IN PROGRESS</small><b>${orders.filter(o=>o.status==="Work in Progress").length}</b></div><div class="fnb-kpi"><small>LATE</small><b>${orders.filter(o=>o.status==="Late").length}</b></div><div class="fnb-kpi"><small>READY</small><b>${orders.filter(o=>o.status==="Ready").length}</b></div><div class="fnb-kpi"><small>ACTIVE</small><b>${orders.length}</b></div></div>

}
function renderKitchenOrders(orders){return `<div class="fnb-table-wrap"><table class="fnb-table"><thead><tr><th>KOT</th><th>Table / Outlet</th><th>Items</th><th>Order Time</th><th>Elapsed</th><th>Status</th><th>Update</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${escapeHtml(o.id)}</b><div style="font-size:10px;color:#7b828c">${escapeHtml(o.priority)}</div></td><td><b>${escapeHtml(o.tableName)}</b><div style="font-size:10px;color:#7b828c">${escapeHtml(o.outlet)}</div></td><td>${o.items.map(i=>`${escapeHtml(i.name)} × ${i.qty}${i.note?`<div style="font-size:10px;color:#777">${escapeHtml(i.note)}</div>`:""}`).join("<hr style='border:0;border-top:1px solid #eee'>")}</td><td>${new Date(o.createdAt).toLocaleString("en-IN")}</td><td>${fnbMinutes(o)}</td><td>${fnbOrderStatus(o.status)}</td><td><div class="ppm-action">${o.status==="New"?`<button class="btn" onclick="updateFNBOrder('${o.id}','Acknowledged')">Acknowledge</button>`:""}${["New","Acknowledged","Late"].includes(o.status)?`<button class="btn" onclick="updateFNBOrder('${o.id}','Work in Progress')">WIP</button>`:""}${["Work in Progress","Acknowledged","Late"].includes(o.status)?`<button class="btn secondary" onclick="updateFNBOrder('${o.id}','Ready')">Ready</button>`:""}${o.status==="Ready"?`<button class="btn" onclick="updateFNBOrder('${o.id}','Served')">Served</button>`:""} </div></td></tr>`).join("")||"<tr><td colspan='7'>No active orders.</td></tr>"}</tbody></table></div>`;}
function showFNBTableBooking(){
 const available=(state.fnbTables||[]).filter(t=>t.status==="Available");
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h2>Book Restaurant Table</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>TABLE</label><select id="tbTable">${available.map(t=>`<option value="${t.id}">${escapeHtml(t.name)} – ${escapeHtml(t.outlet)} – ${t.capacity} pax</option>`).join("")}</select></div><div class="field"><label>GUEST COUNT</label><input id="tbGuests" type="number" min="1" value="2"></div><div class="field"><label>GUEST NAME</label><input id="tbGuest"></div><div class="field"><label>TIME</label><input id="tbTime" type="time"></div></div><button class="btn" style="margin-top:18px" onclick="bookFNBTable()">Confirm Booking</button></div></div>`);

function showFNBOrderModal(){
 const tables=(state.fnbTables||[]).filter(t=>t.status==="Booked"||t.status==="Available");
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal" style="max-width:950px"><div class="modal-head"><h2>Take Food Order / Generate KOT</h2><button class="close" onclick="closeModal()">×</button></div><p class="hint">Submit → KOT appears immediately on Kitchen Live Display.</p><div class="form-grid"><div class="field"><label>TABLE</label><select id="koTable">${tables.map(t=>`<option value="${t.id}">${escapeHtml(t.name)} – ${escapeHtml(t.outlet)}</option>`).join("")}</select></div><div class="field"><label>OUTLET</label><input id="koOutlet" value="All Day Dining"></div><div class="field"><label>WAITER / SERVICE EMPLOYEE</label><input id="koWaiter" value="${escapeHtml(state.user?.name||"Service Staff")}"></div><div class="field"><label>GUEST COUNT</label><input id="koGuests" type="number" min="1" value="2"></div><div class="field"><label>PRIORITY</label><select id="koPriority"><option>Normal</option><option>High</option><option>Urgent</option></select></div><div class="field full"><label>ORDER NOTES</label><textarea id="koNotes" rows="2"></textarea></div><div class="field"><label>ITEM 1</label><input id="koI1"></div><div class="field"><label>QTY</label><input id="koQ1" type="number" min="1" value="1"></div><div class="field"><label>NOTE</label><input id="koN1"></div><div class="field"><label>ITEM 2</label><input id="koI2"></div><div class="field"><label>QTY</label><input id="koQ2" type="number" min="1" value="1"></div><div class="field"><label>NOTE</label><input id="koN2"></div><div class="field"><label>ITEM 3</label><input id="koI3"></div><div class="field"><label>QTY</label><input id="koQ3" type="number" min="1" value="1"></div><div class="field"><label>NOTE</label><input id="koN3"></div></div><button class="btn" style="margin-top:18px" onclick="createFNBOrder()">Send KOT to Kitchen</button></div></div>`);
}
function createFNBOrder(){
 const t=state.fnbTables.find(x=>x.id===document.getElementById("koTable").value);if(!t){alert("Select table.");return}
 const items=[];for(let i=1;i<=3;i++){const n=document.getElementById("koI"+i).value.trim();if(n)items.push({name:n,qty:Number(document.getElementById("koQ"+i).value||1),note:document.getElementById("koN"+i).value});}
 if(!items.length){alert("Add at least one item.");return}
 const now=new Date(),id=`KOT-${now.getFullYear()}-${String((state.fnbOrders||[]).length+1).padStart(3,"0")}`;
 state.fnbOrders.push({id,tableId:t.id,tableName:t.name,outlet:document.getElementById("koOutlet").value,guestCount:Number(document.getElementById("koGuests").value||1),waiter:document.getElementById("koWaiter").value,createdAt:now.toISOString(),ackAt:"",startAt:"",readyAt:"",servedAt:"",status:"New",priority:document.getElementById("koPriority").value,notes:document.getElementById("koNotes").value,items});
 saveFNB();closeModal();openFNBService();alert(`${id} sent to Kitchen Live Display.`);
}
function updateFNBOrder(id,status){const o=state.fnbOrders.find(x=>x.id===id);if(!o)return;const n=new Date().toISOString();if(status==="Acknowledged")o.ackAt=n;if(status==="Work in Progress")o.startAt=n;if(status==="Ready")o.readyAt=n;if(status==="Served"){o.servedAt=n;const t=state.fnbTables.find(x=>x.id===o.tableId);if(t)t.status="Available";}o.status=status;saveFNB();openFNBKitchen();}
function viewFNBOrder(id){const o=state.fnbOrders.find(x=>x.id===id);if(!o)return;document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal" style="max-width:820px"><div class="modal-head"><h2>${escapeHtml(o.id)} – KOT Detail</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>TABLE</label><div>${escapeHtml(o.tableName)} • ${escapeHtml(o.outlet)}</div></div><div class="field"><label>WAITER</label><div>${escapeHtml(o.waiter)}</div></div><div class="field"><label>STATUS</label><div>${fnbOrderStatus(o.status)}</div></div><div class="field"><label>ORDER TIME</label><div>${new Date(o.createdAt).toLocaleString("en-IN")}</div></div></div><table class="fnb-order-lines"><tr><th>Item</th><th>Qty</th><th>Note</th></tr>${o.items.map(i=>`<tr><td>${escapeHtml(i.name)}</td><td>${i.qty}</td><td>${escapeHtml(i.note||"")}</td></tr>`).join("")}</table><div class="sla-box" style="margin-top:14px"><b>Timing:</b> ${fnbMinutes(o)} • Standard ${fnbSlaMinutes(o.priority)} min</div></div></div>`);}

function flsfasOverall(a){const items=a.items||[];if(!items.length)return 0;const max=items.length*10,got=items.reduce((s,x)=>s+Number(x.score||0),0);return Math.round(got/max*100);}

function renderFLSFASAuditTable(rows){return `<div class="flsfas-table-wrap"><table class="flsfas-table"><thead><tr><th>Audit ID</th><th>Type</th><th>Month</th><th>Hotel</th><th>Auditor</th><th>Score</th><th>Non-Compliant</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(a=>{const bad=(a.items||[]).filter(i=>i.status==="Not OK").length,s=flsfasOverall(a);return `<tr class="${bad?"flsfas-bad":s>=90?"flsfas-ok":"flsfas-warn"}"><td><span class="ticket-id">${escapeHtml(a.id)}</span></td><td>${escapeHtml(a.type)}</td><td>${escapeHtml(a.month)}</td><td>${escapeHtml(a.hotel)}</td><td>${escapeHtml(a.auditor)}</td><td><b>${s}%</b></td><td>${bad}</td><td>${escapeHtml(a.status)}</td><td><button class="btn secondary" onclick="viewFLSFASAudit('${a.id}')">View</button></td></tr>`}).join("")||"<tr><td colspan='9'>No audits found.</td></tr>"}</tbody></table></div>`;}

function createFLSFASAudit(){
 const type=document.getElementById("faType").value,month=document.getElementById("faMonth").value||new Date().toISOString().slice(0,7);
 const items=type==="FLS"?[
 ["Fire Alarm Panel","Panel healthy and no fault indication"],["Smoke Detectors","Sampling / inspection completed"],["Fire Extinguishers","Pressure, seal and validity checked"],["Hydrant / Hose Reel","Accessibility and condition"],["Emergency Exit","Exit path clear and signage visible"],["Fire Pump","Auto/manual start test"],["Fire Doors","Door closing and smoke seal condition"],["Emergency Lighting","Battery backup test"],["Evacuation Plan","Current plan displayed at required points"],["Fire Drill","Monthly drill conducted and record available"]
 ]:[
 ["Fire Alarm System","Panel normal / no active fault"],["Manual Call Points","Functional test completed"],["Sounder / Hooter","Audibility test completed"],["Strobe / Visual Alarm","Visual alarm tested"],["Fire Alarm Battery","Battery voltage / backup duration"],["Loop / Zone Health","No open / short / isolation fault"],["Detector Test Records","Sample detectors tested as per schedule"],["Interface with HVAC","AHU shutdown / interface tested"],["Interface with Lift","Fire mode / recall interface tested"],["Logbook / Service Record","Monthly FAS service record complete"]
 ].map(x=>({area:x[0],check:x[1],score:0,status:"Pending",remarks:""}));
 const id=`${type}-${month.replace("-","")}-${String((state.flsfasAudits||[]).length+1).padStart(3,"0")}`;
 const a={id,type,month,hotel:document.getElementById("faHotel").value,auditor:document.getElementById("faAuditor").value,score:0,status:"Draft",remarks:document.getElementById("faRemarks").value,items};
 state.flsfasAudits.push(a);saveFLSFASAudits();closeModal();viewFLSFASAudit(id);
}
function viewFLSFASAudit(id){
 const a=state.flsfasAudits.find(x=>x.id===id);if(!a)return;
 const score=flsfasOverall(a),bad=(a.items||[]).filter(i=>i.status==="Not OK").length,done=(a.items||[]).filter(i=>i.status!=="Pending").length;
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal" style="max-width:1100px"><div class="modal-head"><div><h2>${escapeHtml(a.type)} Monthly Audit</h2><p style="margin:4px 0;color:#737b85">${escapeHtml(a.id)} • ${escapeHtml(a.hotel)} • ${escapeHtml(a.month)}</p></div><button class="close" onclick="closeModal()">×</button></div>
 <div class="flsfas-summary"><div class="flsfas-mini"><small>SCORE</small><b>${score}%</b></div><div class="flsfas-mini"><small>ITEMS</small><b>${a.items.length}</b></div><div class="flsfas-mini"><small>COMPLETED</small><b>${done}</b></div><div class="flsfas-mini"><small>NON-COMPLIANT</small><b>${bad}</b></div><div class="flsfas-mini"><small>AUDITOR</small><b style="font-size:13px">${escapeHtml(a.auditor)}</b></div><div class="flsfas-mini"><small>STATUS</small><b style="font-size:13px">${escapeHtml(a.status)}</b></div></div>
 <div class="flsfas-meter"><span style="width:${score}%"></span></div><div class="flsfas-table-wrap" style="margin-top:14px"><table class="flsfas-table"><thead><tr><th>Area</th><th>Audit Check</th><th>Status</th><th>Marks /10</th><th>Remarks / Corrective Action</th></tr></thead><tbody>${a.items.map((i,n)=>`<tr class="${flsfasItemClass(i.status)}"><td>${escapeHtml(i.area)}</td><td>${escapeHtml(i.check)}</td><td><select onchange="updateFLSFASItem('${a.id}',${n},this.value)"><option ${i.status==="Pending"?"selected":""}>Pending</option><option ${i.status==="OK"?"selected":""}>OK</option><option ${i.status==="Not OK"?"selected":""}>Not OK</option><option ${i.status==="N/A"?"selected":""}>N/A</option></select></td><td><input type="number" min="0" max="10" value="${Number(i.score||0)}" onchange="updateFLSFASScore('${a.id}',${n},this.value)" style="width:70px"></td><td><textarea onchange="updateFLSFASRemark('${a.id}',${n},this.value)" rows="2">${escapeHtml(i.remarks||"")}</textarea></td></tr>`).join("")}</tbody></table></div>
 <div class="field full" style="margin-top:14px"><label>AUDIT REMARKS</label><textarea id="faAuditRemarks" rows="3">${escapeHtml(a.remarks||"")}</textarea></div><div class="ppm-action" style="margin-top:14px"><button class="btn secondary" onclick="saveFLSFASAudit('${a.id}')">Save Audit</button><button class="btn" onclick="completeFLSFASAudit('${a.id}')">Complete Audit</button></div></div></div>`);
}
function updateFLSFASItem(id,n,val){const a=state.flsfasAudits.find(x=>x.id===id);if(!a)return;a.items[n].status=val;saveFLSFASAudits();}
function updateFLSFASScore(id,n,val){const a=state.flsfasAudits.find(x=>x.id===id);if(!a)return;a.items[n].score=Math.max(0,Math.min(10,Number(val)||0));saveFLSFASAudits();}
function updateFLSFASRemark(id,n,val){const a=state.flsfasAudits.find(x=>x.id===id);if(!a)return;a.items[n].remarks=val;saveFLSFASAudits();}
function saveFLSFASAudit(id){const a=state.flsfasAudits.find(x=>x.id===id);if(!a)return;a.remarks=document.getElementById("faAuditRemarks")?.value||a.remarks;a.score=flsfasOverall(a);saveFLSFASAudits();alert(`Audit saved. Current score: ${a.score}%`);}
function completeFLSFASAudit(id){const a=state.flsfasAudits.find(x=>x.id===id);if(!a)return;a.remarks=document.getElementById("faAuditRemarks")?.value||a.remarks;a.score=flsfasOverall(a);a.status="Completed";a.completedAt=new Date().toLocaleString("en-IN");saveFLSFASAudits();document.getElementById("modal")?.remove();openFLSFASAudit("dashboard");}

function renderAFLSHistory(rows){return `<div class="afls-table-wrap"><table class="afls-table"><thead><tr><th>ID</th><th>Type</th><th>Month</th><th>Hotel</th><th>Auditor</th><th>Score</th><th>Non-Compliant</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(a=>{const bad=(a.items||[]).filter(i=>i.status==="Not OK").length;return `<tr class="${bad?"afls-bad":a.score>=90?"afls-ok":"afls-na"}"><td>${escapeHtml(a.id)}</td><td>${escapeHtml(a.type)}</td><td>${escapeHtml(a.month)}</td><td>${escapeHtml(a.hotel)}</td><td>${escapeHtml(a.auditor)}</td><td>${Number(a.score||0)}%</td><td>${bad}</td><td>${escapeHtml(a.status)}</td><td><button class="btn secondary" onclick="viewAFLSAudit('${a.id}')">View</button></td></tr>`}).join("")||"<tr><td colspan='9'>No audit records.</td></tr>"}</tbody></table></div>`;}
function createAFLSAudit(){
 state.aflsPropertyType=document.getElementById("abPropertyType").value;
 const type=document.getElementById("abType").value,month=document.getElementById("abMonth").value,hotel=document.getElementById("abHotel").value,auditor=document.getElementById("abAuditor").value;
 const items=aflsCatalog().map(x=>({area:x.area,check:x.check,status:"Pending",score:0,maxScore:10,remarks:""}));
 const id=`${type}-${month.replace("-","")}-${String((state.aflsAudits||[]).length+1).padStart(3,"0")}`;
 state.aflsAudits.push({id,type,month,hotel,auditor,propertyType:state.aflsPropertyType,score:0,status:"Draft",items,remarks:""});
 saveAFLSAudits();openAFLSBrandAudit();viewAFLSAudit(id);
}
function aflsScore(a){const applicable=(a.items||[]).filter(x=>x.status!=="N/A"),max=applicable.length*10,got=applicable.reduce((s,x)=>s+Math.min(10,Math.max(0,Number(x.score||0))),0);return max?Math.round(got/max*100):0;}
function viewAFLSAudit(id){
 const a=state.aflsAudits.find(x=>x.id===id);if(!a)return;
 const score=aflsScore(a),bad=a.items.filter(i=>i.status==="Not OK").length,checked=a.items.filter(i=>i.status!=="Pending").length;
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="modal"><div class="modal" style="max-width:1150px"><div class="modal-head"><div><h2>${escapeHtml(a.type)} Monthly Audit Checklist</h2><p style="margin:4px 0;color:#737b85">${escapeHtml(a.id)} • ${escapeHtml(a.hotel)} • ${escapeHtml(a.month)}</p></div><button class="close" onclick="closeModal()">×</button></div>
 <div class="fasfls-score-summary"><div class="fasfls-score-card"><small>OVERALL SCORE</small><b id="aflsOverallScore">${score}%</b></div><div class="fasfls-score-card"><small>TOTAL MARKS</small><b id="aflsTotalMarks">${a.items.filter(i=>i.status!=="N/A").reduce((s,i)=>s+Number(i.score||0),0)}</b></div><div class="fasfls-score-card"><small>MAX MARKS</small><b id="aflsMaxMarks">${a.items.filter(i=>i.status!=="N/A").length*10}</b></div><div class="fasfls-score-card"><small>CHECKED</small><b id="aflsChecked">${checked}/${a.items.length}</b></div><div class="fasfls-score-card"><small>NON-COMPLIANT</small><b id="aflsBad">${bad}</b></div></div>
 <div class="fasfls-scorebar"><span id="aflsScoreBar" style="width:${score}%"></span></div>
 <div class="flsfas-alert" style="margin-top:12px">Scoring: <b>0–10 marks per checkpoint</b>. Enter actual marks and remarks/corrective action just like the PPM checklist. A lower score should be supported by a clear remark.</div>
 <div style="overflow:auto;margin-top:14px"><table class="afls-table"><thead><tr><th style="width:170px">Area</th><th>Audit Check</th><th style="width:120px">Status</th><th style="width:105px">Marks /10</th><th class="fasfls-remark">Remarks / Corrective Action</th></tr></thead><tbody>${a.items.map((i,n)=>`<tr id="aflsRow${n}" class="${flsfasItemClass(i.status)}"><td>${escapeHtml(i.area)}</td><td>${escapeHtml(i.check)}</td><td><select onchange="updateAFLSItem('${a.id}',${n},this.value)"><option ${i.status==="Pending"?"selected":""}>Pending</option><option ${i.status==="OK"?"selected":""}>OK</option><option ${i.status==="Not OK"?"selected":""}>Not OK</option><option ${i.status==="N/A"?"selected":""}>N/A</option></select></td><td><input type="number" min="0" max="10" step="1" value="${Number(i.score||0)}" onchange="updateAFLSScore('${a.id}',${n},this.value)" style="width:75px"><div class="fasfls-total">/ 10</div></td><td><textarea rows="2" onchange="updateAFLSRemark('${a.id}',${n},this.value)" placeholder="Observation / action required">${escapeHtml(i.remarks||"")}</textarea></td></tr>`).join("")}</tbody></table></div>
 <div class="field full" style="margin-top:14px"><label>AUDIT REMARKS / MANAGEMENT SUMMARY</label><textarea id="aflsRemarks" rows="3" placeholder="Overall audit observations, major gaps and corrective actions">${escapeHtml(a.remarks||"")}</textarea></div><div class="ppm-action" style="margin-top:14px"><button class="btn secondary" onclick="saveAFLSAudit('${a.id}')">Save Audit</button><button class="btn" onclick="completeAFLSAudit('${a.id}')">Complete Audit</button></div></div></div>`);
}

function refreshAFLSModal(a){
 const score=aflsScore(a),app=a.items.filter(i=>i.status!=="N/A"),total=app.reduce((s,i)=>s+Number(i.score||0),0),max=app.length*10,checked=a.items.filter(i=>i.status!=="Pending").length,bad=a.items.filter(i=>i.status==="Not OK").length;
 const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val};
 set("aflsOverallScore",score+"%");set("aflsTotalMarks",total);set("aflsMaxMarks",max);set("aflsChecked",checked+"/"+a.items.length);set("aflsBad",bad);
 const bar=document.getElementById("aflsScoreBar");if(bar)bar.style.width=score+"%";
}
function updateAFLSItem(id,n,v){const a=state.aflsAudits.find(x=>x.id===id);if(!a)return;a.items[n].status=v;const row=document.getElementById("aflsRow"+n);if(row)row.className=flsfasItemClass(v);saveAFLSAudits();refreshAFLSModal(a);}
function updateAFLSScore(id,n,v){const a=state.aflsAudits.find(x=>x.id===id);if(!a)return;a.items[n].score=Math.max(0,Math.min(10,Number(v)||0));saveAFLSAudits();refreshAFLSModal(a);}
function updateAFLSRemark(id,n,v){const a=state.aflsAudits.find(x=>x.id===id);if(!a)return;a.items[n].remarks=v;saveAFLSAudits();}
function saveAFLSAudit(id){const a=state.aflsAudits.find(x=>x.id===id);if(!a)return;a.remarks=document.getElementById("aflsRemarks")?.value||a.remarks;a.score=aflsScore(a);saveAFLSAudits();alert(`Audit saved. Current score: ${a.score}%`);}
function completeAFLSAudit(id){const a=state.aflsAudits.find(x=>x.id===id);if(!a)return;a.remarks=document.getElementById("aflsRemarks")?.value||a.remarks;a.score=aflsScore(a);a.status="Completed";a.completedAt=new Date().toLocaleString("en-IN");saveAFLSAudits();document.getElementById("modal")?.remove();openAFLSBrandAudit("dashboard");}


function saveDepartmentInventory(){localStorage.setItem("insync_department_inventory",JSON.stringify(state.deptInventory||[]));localStorage.setItem("insync_inventory_transactions",JSON.stringify(state.inventoryTransactions||[]));}
function inventoryAutoReceived(){
 let received={};
 (state.grns||[]).forEach(g=>{
  const po=(state.purchaseOrders||[]).find(p=>p.id===g.poId),pr=po?(state.purchaseRequests||[]).find(x=>x.id===po.prId):null;
  if(!pr||pr.department!=="Engineering")return;
  (g.items||[]).forEach(i=>{
    const k=i.material;
    received[k]=(received[k]||0)+Number(i.received||0);
  });
 });
 return received;
}
function syncInventoryReceived(){
 const received=inventoryAutoReceived();
 Object.keys(received).forEach(name=>{
  let i=(state.deptInventory||[]).find(x=>x.name===name||x.materialCode===name);
  if(!i){i={id:"INV-ENG-"+String((state.deptInventory||[]).length+1).padStart(3,"0"),materialCode:"PUR-"+String((state.deptInventory||[]).length+1).padStart(4,"0"),name,category:"Purchase Linked Material",unit:"Nos",openingQty:0,receivedQty:0,consumedQty:0,assignedQty:0,employeeAssignments:[],commonQty:0,condition:"New"};state.deptInventory.push(i);}
  i.receivedQty=received[name];
 });
 saveDepartmentInventory();
}
function inventoryBalance(i){return Math.max(0,Number(i.openingQty||0)+Number(i.receivedQty||0)-Number(i.consumedQty||0));}
function assignedTotal(i){return (i.employeeAssignments||[]).filter(a=>a.status==="Issued"||a.status==="Common").reduce((s,a)=>s+Number(a.qty||0),0);}
function inventoryAvailable(i){return Math.max(0,inventoryBalance(i)-assignedTotal(i));}
function monthInventoryData(month){
 const tx=(state.inventoryTransactions||[]).filter(x=>(x.date||"").slice(0,7)===month);
 const rec=inventoryAutoReceived();
 return {tx,received:Object.values(rec).reduce((s,n)=>s+Number(n||0),0),consumed:tx.filter(x=>x.type==="Consumed").reduce((s,x)=>s+Number(x.qty||0),0)};
}

 } else {

  // Do not make one global count input misleading; render per item below.
  detail.innerHTML=`<div class="panel" style="margin-top:18px"><div class="page-head"><div><h3>Monthly Inventory Audit Report</h3><p style="margin-top:5px">Month: ${month}. Match system stock with physical stock and capture variance.</p></div><button class="btn secondary" onclick="exportInventoryAudit('${month}')">📊 Excel</button></div>

function renderCoordTable(type,rows){
 const heads={MOM:["Action / Decision","Owner","Due","Priority","Status","Details"],RFI:["RFI No.","Technical Query","Raised By","Response Due","Priority","Status"],DRAWINGS:["Drawing No.","Title / Discipline","Revision","Submitted","Approved","Status"],MATERIAL:["Material","Brand / Specification","Submitted","Reviewer","Priority","Status"],BLOCKERS:["Blocker / Dependency","Responsible","Impact","Required By","Priority","Status"]}[type];
 return `<div class="projectcoord-table-wrap"><table class="projectcoord-table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}<th>Action</th></tr></thead><tbody>${rows.map(x=>{const c=type==="MOM"?[x.title,x.owner,x.due,x.priority,x.status,x.action]:type==="RFI"?[x.id,x.query,x.raisedBy,x.responseDue,x.priority,x.status]:type==="DRAWINGS"?[x.number,x.title,x.revision,x.submitted,x.approved,x.status]:type==="MATERIAL"?[x.material,x.spec,x.submitted,x.reviewer,x.priority,x.status]:[x.blocker,x.responsible,x.impact,x.requiredBy,x.priority,x.status];return `<tr>${c.map((v,i)=>`<td>${i===heads.length-1?projectCoordPill(v):escapeHtml(v||"—")}</td>`).join("")}<td><button class="btn secondary" style="padding:7px 10px;font-size:11px" onclick="viewProjectCoord('${type}','${x.id}')">View</button></td></tr>`}).join("")||`<tr><td colspan="${heads.length+1}">No records yet.</td></tr>`}</tbody></table></div>`;
}
function addProjectCoord(type){
 const id=prompt("Reference / ID",`${type}-${String(Date.now()).slice(-5)}`);if(!id)return;const today=new Date().toISOString().slice(0,10);
 if(type==="MOM"){
 const meetingDate=prompt("Meeting Date (YYYY-MM-DD)\nExample: 2026-08-29",today);if(meetingDate===null)return;
 const attendees=prompt("Who attended? Enter names with email IDs.\nExample: Rahul Kumar <rahul@hotel.com>, Priya Singh <priya@hotel.com>","");if(attendees===null)return;
 const discussion=prompt("Discussion Point / Agenda\nExample: Review of pending guest room finishing work","");if(discussion===null)return;
 const owner=prompt("Action Owner / Responsible Person\nExample: Project Manager / Chief Engineer","Project Team");if(owner===null)return;
 const deadline=prompt("Deadline / Target Date (YYYY-MM-DD)\nExample: 2026-09-05",today);if(deadline===null)return;
 const remarks=prompt("Remarks / Decision / Follow-up Notes\nExample: Submit revised drawing before owner review","");if(remarks===null)return;
 const priority=prompt("Priority","High")||"High";
 const rec={id,meetingDate,attendees,discussion,owner,deadline,remarks,priority,status:"Open"};
 state.projectMOM.push(rec);saveProjectCoord();
 if(confirm("MOM saved successfully. Send MOM notification email to all attendee email IDs now?")) sendMOMEmail(rec);
 openProjectCoord("MOM");return;
}
 if(type==="RFI")state.projectRFI.push({id,query:prompt("Technical Query",""),raisedBy:prompt("Raised By","Project Engineer"),responseDue:prompt("Response Due",today),priority:prompt("Priority","High"),status:"Open"});
 if(type==="DRAWINGS")state.projectDrawings.push({id,number:id,title:prompt("Drawing Title / Discipline",""),revision:prompt("Revision","R0"),submitted:today,approved:"",status:"Pending"});
 if(type==="MATERIAL")state.projectMaterials.push({id,material:prompt("Material Name",""),spec:prompt("Brand / Specification",""),submitted:today,reviewer:prompt("Reviewer","Consultant"),priority:prompt("Priority","High"),status:"Pending"});
 if(type==="BLOCKERS")state.projectBlockers.push({id,blocker:prompt("Blocker / Dependency",""),responsible:prompt("Responsible",""),impact:prompt("Impact Area",""),requiredBy:prompt("Required By",today),priority:prompt("Priority","Critical"),status:"Open"});
 saveProjectCoord();openProjectCoord(type);
}

function sendMOMEmail(x){

 if(!emails.length){alert("No valid attendee email found. Add emails in Attendees field, e.g. Name <email@hotel.com>.");return;}
 const property=state.selectedProperty||"Project";
 const subject=`MOM Notification | ${property} | ${x.id}`;
 const body=`Dear Team,%0D%0A%0D%0APlease find the Meeting Minutes / Action details below:%0D%0A%0D%0AMOM No.: ${x.id}%0D%0AMeeting Date: ${x.meetingDate}%0D%0AAttendees: ${x.attendees}%0D%0ADiscussion Point: ${x.discussion}%0D%0AAction Owner: ${x.owner}%0D%0ADeadline: ${x.deadline}%0D%0ARemarks / Decision: ${x.remarks}%0D%0APriority: ${x.priority}%0D%0AStatus: ${x.status}%0D%0A%0D%0APlease acknowledge and complete the assigned actions within the deadline.%0D%0A%0D%0ARegards,%0D%0AINSYNC Operations`;
 window.location.href=`mailto:${emails.join(",")}?subject=${encodeURIComponent(subject)}&body=${body}`;

function attendanceStats(employeeId, month){
 const [y,m]=month.split("-").map(Number);
 const days=new Date(y,m,0).getDate();
 let p=0,a=0,l=0,wo=0;
 for(let d=1;d<=days;d++){
   const k=`${employeeId}_${month}-${String(d).padStart(2,"0")}`;
   const v=state.attendance[k]||"";
   if(v==="P")p++; else if(v==="A")a++; else if(v==="L")l++; else if(v==="WO")wo++;
 }
 return {p,a,l,wo};
}
function attendanceTotals(month){
 let p=0,a=0,l=0,wo=0;
 (state.staff||[]).forEach(s=>{const x=attendanceStats(s.id,month);p+=x.p;a+=x.a;l+=x.l;wo+=x.wo;});
 return {p,a,l,wo,staff:(state.staff||[]).filter(s=>s.status!=="Inactive").length};
}

function cycleAttendance(key){
 const order=["","P","A","L","WO"];
 const current=state.attendance[key]||"";

 openAttendance();
}

function exportAttendanceCSV(month){
 const [y,m]=month.split("-").map(Number),days=new Date(y,m,0).getDate();
 const rows=[["Employee ID","Employee Name",...Array.from({length:days},(_,i)=>i+1),"Present","Absent","Leave","WO"]];
 (state.staff||[]).forEach(s=>{
   const vals=[];for(let d=1;d<=days;d++)vals.push(state.attendance[`${s.id}_${month}-${String(d).padStart(2,"0")}`]||"");
   const st=attendanceStats(s.id,month);rows.push([s.id,s.name,...vals,st.p,st.a,st.l,st.wo]);
 });
 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`Attendance_${month}.csv`;a.click();
}

   const detector=new BarcodeDetector({formats:["qr_code","code_128","ean_13","ean_8"]});
   const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
   video.style.display="block";video.srcObject=stream;await video.play();
   const scan=async()=>{
     if(video.readyState>=2){
       try{
         const codes=await detector.detect(video);
         if(codes.length){
           let raw=codes[0].rawValue||"";
           try{raw=JSON.parse(raw).token||raw;}catch(e){}
           document.getElementById("verifyToken").value=raw;
           stream.getTracks().forEach(t=>t.stop());video.style.display="none";verifyVisitorToken();return;
         }
       }catch(e){}
     }
     requestAnimationFrame(scan);
   };
   scan();
 }catch(e){alert("Camera access was blocked or unavailable.");}
}

function keyStatus(v){
 if(v==="Approved")return '<span class="key-pill key-approved">Approved</span>';
 if(v==="Pending HOD Approval")return '<span class="key-pill key-pending">Pending HOD Approval</span>';
 if(v==="Issued")return '<span class="key-pill key-issued">Issued</span>';
 if(v==="Returned")return '<span class="key-pill key-returned">Returned</span>';
 if(v==="Overdue")return '<span class="key-pill key-overdue">OVERDUE</span>';
 return '<span class="key-pill key-rejected">Rejected</span>';
}
function keyIsOverdue(k){
 if(k.status==="Returned"||!k.dueDate||!k.dueTime)return false;
 const due=new Date(`${k.dueDate}T${k.dueTime}:00`);
 return new Date()>due;
}
function refreshKeyStatuses(){
 let changed=false, overdueList=[];
 (state.keyIssues||[]).forEach(k=>{
   if(keyIsOverdue(k)){
     if(k.status!=="Overdue"){k.status="Overdue";changed=true;}
     overdueList.push(k);
   }
 });
 if(changed)saveKeyIssues();
 if(overdueList.length){
   try{
     if("Notification" in window && Notification.permission==="granted"){
       const first=overdueList[0];
       new Notification("INSYNC OPERATIONS – Key Return Overdue",{body:`${first.employee} has not returned ${first.keyName} by ${first.dueTime}. HOD & GM attention required.`});
     }
   }catch(e){}
 }
 return overdueList;
}

     const ratio=Math.min(pageW/canvas.width,pageH/canvas.height);
     const w=canvas.width*ratio,h=canvas.height*ratio;

 state.ppmOpenCategory=state.ppmOpenCategory||cats[0];
 const cat=state.ppmOpenCategory;
 const catItems=r.checklist.filter(x=>(x.category||"General")===cat);
 const total=r.checklist.length;
 const completed=r.checklist.filter(x=>x.status==="OK"||x.status==="N/A").length;
 const catOK=catItems.filter(x=>x.status==="OK"||x.status==="N/A").length;
 document.body.insertAdjacentHTML("beforeend",`<div class="modal-bg" id="ppmModal"><div class="modal" style="max-width:1100px">
  <div class="modal-head"><div><h2>Room ${escapeHtml(r.room)} – PPM Checklist</h2><p style="margin:5px 0;color:#727782">${escapeHtml(r.type)} • ${escapeHtml(r.scheduledDate||"")}</p></div><button class="close" onclick="document.getElementById('ppmModal').remove()">×</button></div>
  <div class="ppm-score"><div style="font-size:12px;color:#aeb3b8;font-weight:800">OVERALL CHECKLIST COMPLETION</div><div class="ppm-score-main">${score}%</div><div class="ppm-score-bar"><div class="ppm-score-fill" style="width:${score}%"></div></div><div style="margin-top:10px;color:#b7bcc0;font-size:12px">${completed} of ${total} items completed</div></div>
  <div class="ppm-category-summary"><div class="ppm-category-mini"><small>DEPARTMENT / CATEGORY</small><b>${escapeHtml(cat)}</b></div><div class="ppm-category-mini"><small>CATEGORY ITEMS</small><b>${catItems.length}</b></div><div class="ppm-category-mini"><small>CATEGORY DONE</small><b>${catOK}</b></div><div class="ppm-category-mini"><small>CATEGORY %</small><b>${catItems.length?Math.round(catOK/catItems.length*100):0}%</b></div></div>
  <div class="ppm-category-tabs">${cats.map(c=>`<button class="ppm-category-tab ${c===cat?"active":""}" onclick="state.ppmOpenCategory='${escapeHtml(c)}';document.getElementById('ppmModal')?.remove();showPPMChecklist('${escapeHtml(r.room)}')">${escapeHtml(c)}</button>`).join("")}</div>
  <div style="overflow:auto"><table class="ppm-item-table"><thead><tr><th style="width:55px">S.No.</th><th>Checklist Item</th><th style="width:140px">Status</th><th style="width:280px">Remarks / Observation</th></tr></thead><tbody>
  ${catItems.map((c,idx)=>{const global=r.checklist.indexOf(c);return `<tr><td>${idx+1}</td><td>${escapeHtml(c.item)}</td><td><select onchange="updatePPMCheck('${escapeHtml(r.room)}',${global},this.value)"><option ${c.status==="Pending"?"selected":""}>Pending</option><option ${c.status==="OK"?"selected":""}>OK</option><option ${c.status==="Not OK"?"selected":""}>Not OK</option><option ${c.status==="N/A"?"selected":""}>N/A</option></select></td><td><textarea onchange="updatePPMRemark('${escapeHtml(r.room)}',${global},this.value)" placeholder="Enter observation">${escapeHtml(c.remarks||"")}</textarea></td></tr>`;}).join("")}
  </tbody></table></div>
  <div class="form-grid" style="margin-top:16px"><div class="field"><label>COMPLETED BY</label><input id="ppmCompletedBy" value="${escapeHtml(r.completedBy||state.user?.name||"Engineer")}"></div><div class="field"><label>COMPLETED DATE</label><input id="ppmCompletedDate" type="date" value="${escapeHtml(r.completedDate||new Date().toISOString().slice(0,10))}"></div><div class="field full"><label>FINAL REMARKS</label><textarea id="ppmFinalRemarks" rows="3">${escapeHtml(r.remarks||"")}</textarea></div></div>
  <div class="ppm-action" style="margin-top:18px"><button class="btn" onclick="savePPMChecklist('${escapeHtml(r.room)}')">Save Checklist</button><button class="btn secondary" onclick="completePPM('${escapeHtml(r.room)}')">Mark PPM Completed</button></div>
 </div></div>`);
}

function updatePPMCheck(roomNo,i,val){const r=state.ppmRooms.find(x=>x.room===roomNo);if(!r)return;r.checklist[i].status=val;savePPM();}
function updatePPMRemark(roomNo,i,val){const r=state.ppmRooms.find(x=>x.room===roomNo);if(!r)return;r.checklist[i].remarks=val;savePPM();}
function savePPMChecklist(roomNo){const r=state.ppmRooms.find(x=>x.room===roomNo);if(!r)return;r.score=ppmScore(r);savePPM();alert(`Room ${roomNo} checklist saved. Completion score: ${r.score}%`);}
function completePPM(roomNo){
 const r=state.ppmRooms.find(x=>x.room===roomNo);if(!r)return;
 r.score=ppmScore(r);r.status="Pending Approval";r.completedBy=document.getElementById("ppmCompletedBy").value;r.completedDate=document.getElementById("ppmCompletedDate").value;r.remarks=document.getElementById("ppmFinalRemarks").value;r.hodApproval="Pending";r.hkApproval="Pending";r.gmAlert="No";
 savePPM();document.getElementById("ppmModal")?.remove();openPPMRooms("approvals");
}
function sendPPMApproval(roomNo){
 const r=state.ppmRooms.find(x=>x.room===roomNo);if(!r)return;r.status="Pending Approval";r.hodApproval="Pending";r.hkApproval="Pending";savePPM();openPPMRooms("approvals");
}
function approvePPM(roomNo,who){
 const r=state.ppmRooms.find(x=>x.room===roomNo);if(!r)return;
 if(who==="hod")r.hodApproval="Approved";if(who==="hk")r.hkApproval="Approved";
 if(r.hodApproval==="Approved"&&r.hkApproval==="Approved"){r.status="Approved";r.gmAlert="Alert Sent to GM";alert(`Room ${roomNo} PPM approved. GM alert generated.`);}
 savePPM();openPPMRooms("approvals");
}
function exportPPMReport(){
 const hotel="Park Inn Suites Roorkee";
 const rows=[["Hotel","Room","Room Type","Scheduled Date","Completed Date","Score","HOD Approval","Executive Housekeeper Approval","Status","GM Alert"],...(state.ppmRooms||[]).map(r=>[hotel,r.room,r.type,r.scheduledDate,r.completedDate,r.score,r.hodApproval,r.hkApproval,r.status,r.gmAlert])];
 const csv=rows.map(row=>row.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="PPM_Room_Audit_Report.csv";a.click();
}

function openModuleDetail(dept,module){
 const detail=document.getElementById("module-detail");
 if(!detail) return;
 let body="";
 if(dept==="Engineering" && module==="Asset Master"){
   body=`<div class="form-grid">
   <div class="field"><label>ASSET ID</label><input placeholder="ENG-0001"></div>
   <div class="field"><label>ASSET NAME</label><input placeholder="Chiller / DG / Pump"></div>
   <div class="field"><label>LOCATION</label><input placeholder="Plant Room"></div>
   <div class="field"><label>AMC / WARRANTY</label><input placeholder="Vendor / Expiry"></div>

   <div class="field"><label>LOCATION / ROOM</label><input placeholder="Room / Area"></div>
   <div class="field full"><label>HLP / COMPLAINT</label><input placeholder="Describe complaint"></div>
   <div class="field"><label>ASSIGNED TO</label><input placeholder="Engineer"></div>
   <div class="field"><label>STATUS</label><select><option>Open</option><option>In Progress</option><option>Closed</option></select></div>
   <div class="field full"><label>ACTION TAKEN</label><textarea rows="3" placeholder="Enter action taken"></textarea></div>
   </div>`;
 } else if(dept==="Engineering" && module==="Logbook"){
   body=`<div class="form-grid">
   <div class="field"><label>DATE</label><input type="date"></div>
   <div class="field"><label>SHIFT</label><select><option>Morning</option><option>Evening</option><option>Night</option></select></div>
   <div class="field"><label>SYSTEM / EQUIPMENT</label><input placeholder="DG / Chiller / STP"></div>
   <div class="field"><label>READING</label><input placeholder="Reading / status"></div>
   <div class="field full"><label>LOGBOOK ENTRY</label><textarea rows="4" placeholder="Enter daily engineering log"></textarea></div>
   </div>`;
 } else {
   body=`<p style="color:#737985">The <b>${module}</b> module is ready in the UI. Its live form and database will be connected in the production/backend phase.</p>`;

 detail.innerHTML=`<div class="panel" style="margin-top:18px"><div class="page-head" style="margin-bottom:14px"><div><h3 style="margin:0">${module}</h3><p style="margin-top:4px">Engineering module</p></div><button class="btn" onclick="alert('Saved locally in prototype mode.')">Save</button></div>${body}</div>`;
 detail.scrollIntoView({behavior:"smooth",block:"nearest"});
